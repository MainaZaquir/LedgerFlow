services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: ledgerflow
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ledgerflow:local_dev_only@db:5432/ledgerflow?schema=public
      SIMULATOR_WEBHOOK_SECRET: ${SIMULATOR_WEBHOOK_SECRET:?Set SIMULATOR_WEBHOOK_SECRET in .env}
      SIMULATOR_ENABLED: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/server.js"]
volumes:
  pgdata:
