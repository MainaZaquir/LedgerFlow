name: Quality and PostgreSQL tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: ledgerflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ledgerflow:local_dev_only@localhost:5432/ledgerflow_test?schema=public
      DATABASE_URL_TEST: postgresql://ledgerflow:local_dev_only@localhost:5432/ledgerflow_test?schema=public
      SIMULATOR_WEBHOOK_SECRET: ci-secret-only-a-long-deterministic-placeholder-1234
      SIMULATOR_ENABLED: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
